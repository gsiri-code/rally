[project]
name = "warehouse-db"
version = "0.1.0"
description = "Databricks SQL warehouse persistence adapters"
readme = "README.md"
authors = [
    { name = "sirichartchai", email = "gs3802@nyu.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "databricks-sql-connector>=4.1.4",
    "models",
]

[tool.uv.sources]
models = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
