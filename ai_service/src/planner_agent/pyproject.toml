[project]
name = "planner-agent"
version = "0.1.0"
description = "In-process planner agent for itinerary contracts"
readme = "README.md"
authors = [
    { name = "sirichartchai", email = "gs3802@nyu.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "orchestrator-agent",
    "pydantic>=2.11.7",
]

[project.scripts]
planner-agent = "planner_agent:main"

[tool.uv.sources]
orchestrator-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
