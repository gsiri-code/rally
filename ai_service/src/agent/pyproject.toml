[project]
name = "agent"
version = "0.1.0"
description = "Main travel planner orchestrator"
readme = "README.md"
authors = [
    { name = "sirichartchai", email = "gs3802@nyu.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "pydantic>=2.11.7",
    "python-dotenv>=1.2.1",
    "rag",
    "uvicorn>=0.35.0",
]

[project.scripts]
agent = "agent.api:main"

[tool.uv.sources]
rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
