[project]
name = "api"
version = "0.1.0"
description = "Trip planner API boundary for v1 routes"
readme = "README.md"
authors = [
    { name = "sirichartchai", email = "gs3802@nyu.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "orchestrator-agent",
    "pydantic>=2.11.9",
    "uvicorn>=0.35.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
